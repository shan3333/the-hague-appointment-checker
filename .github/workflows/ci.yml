name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          APPOINTMENT_MODE: simulated_fixed
          SIMULATE_STATUS: AVAILABLE
      - run: npm run build
      - run: npm pack --dry-run